name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: contentos_github_upload/requirements.txt
      - name: Install dependencies
        run: pip install -r contentos_github_upload/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q contentos_github_upload projects
      - name: Smoke-test standalone demo pages
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [Path('projects/narrative-architect/app.py'), Path('projects/content-impact-lab/app.py')]:
              assert path.exists(), path
              compile(path.read_text(), str(path), 'exec')
          for path in Path('contentos_github_upload/pages').glob('*.py'):
              compile(path.read_text(), str(path), 'exec')
          PY
      - name: Run Content Studio tests
        working-directory: contentos_github_upload
        run: python -m pytest -q
