name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: contentos_github_upload/requirements.txt
      - name: Install dependencies
        run: pip install -r contentos_github_upload/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q contentos_github_upload projects
      - name: Run Content Studio tests
        working-directory: contentos_github_upload
        run: python -m pytest -q
